[workspace]

[package]
name = "dekopon-follow-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Conversation follow lifecycle component for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-follow"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
dekopon-provider-sdk = "=0.50.0"
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.151"
dekopon-provider-sdk-testkit = "=0.50.0"
